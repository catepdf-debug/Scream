<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat PDF Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="overlay" id="overlay">
    <div class="popup">
        <div class="mini-card">
          <img src="./assets/" alt="">
        </div>
        <div class="testo">
            <h2>Attention!</h2>
            <p>
                Your question will be received and posted anonymously
                by a moderator in the WhatsApp group.
            </p>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeMQZIBfNvu5avLJJjnGo6eM2o550DwEquugvOuorPjQHYDLw/viewform"><button class="popup-btn" id="capito">I Understand</button></a>
            
            <button class="popup-btn" id="chiudi">
                <img src="arrowcircle.png" class="icona" alt="">
                Go Back
            </button>
        </div>
    </div>
</div>


  <main id="content"></main>

  <section class="app-search-bar" aria-label="Recherche">
    <form id="global-search-form" class="search-form">
      <input type="search" id="global-search-input" placeholder="What are you screaming for ?" autocomplete="off" />
    </form>
  </section>

  <!-- Modal open/close logic now lives in modal.js, imported from main.js,
       so it can also be triggered from pages/categories.js and pages/category.js -->

<!--
  <footer class="site-footer">
    <p>&copy; 2026 Cat PDF Search</p>
  </footer> -->

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
